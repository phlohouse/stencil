name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stencilpy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stencilpy
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/stencilpy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Build the editor
        working-directory: editor
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Check the wheel bundles the editor UI
        working-directory: .
        run: python scripts/check_wheel_ui.py stencilpy/dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: stencilpy/dist/
